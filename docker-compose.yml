services:
  postgres:
    image: pgvector/pgvector:pg16
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
    environment:
      POSTGRES_USER: vec
      POSTGRES_PASSWORD: vec
      POSTGRES_DB: vec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vec"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  swagger-ui:
    image: swaggerapi/swagger-ui
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    ports:
      - "8080:8080"
    volumes:
      - ./spec:/spec:ro

  pghero:
    image: ankane/pghero:v3.8.0
    environment:
      DATABASE_URL: postgres://vec:vec@postgres:5432/vec
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Daily logical backups (gzipped pg_dump) with daily/weekly/monthly retention.
  # Dumps land in ./backups/{daily,weekly,monthly}; host cron then runs
  # scripts/offsite-sync.sh to copy them to NAS + off-site (3-2-1).
  db-backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: vec
      POSTGRES_USER: vec
      POSTGRES_PASSWORD: vec
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 5
      BACKUP_KEEP_MONTHS: 6
      POSTGRES_EXTRA_OPTS: "--clean --if-exists"
    volumes:
      - ./backups:/backups

volumes:
  pgdata:
